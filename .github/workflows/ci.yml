name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t llm-router-lite .
      - name: Smoke test
        run: |
          docker run -d --name router -p 8080:8080 -e ROUTER_API_KEY=ci llm-router-lite
          for i in $(seq 1 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs -H "Authorization: Bearer ci" -H "Content-Type: application/json" \
            -d '{"model":"demo","messages":[{"role":"user","content":"hello"}]}' \
            localhost:8080/v1/chat/completions | grep -q "echo: hello"
